name: Next 16 Active LTS Migration

on:
  push:
    branches:
      - next15-lts-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      NEXT_PUBLIC_APP_URL: https://konfydence.com
      AUTH_SECRET: migration-ci-only
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4
        with:
          ref: next15-lts-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Next 16 Active LTS stack
        run: |
          npm install --save-exact next@16.3.1 react@19.2.0 react-dom@19.2.0
          npm install --save-dev --save-exact eslint@latest eslint-config-next@16.3.1 @types/react@19.2.2 @types/react-dom@19.2.2

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Scenario bank quality
        run: node scripts/audit-scenario-quality.cjs

      - name: Product claim consistency
        run: node scripts/validate-product-claims.cjs

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test -- --runInBand

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit migration only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json next-env.d.ts
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Upgrade Konfydence to Next 16.3.1 Active LTS"
            git push origin HEAD:next15-lts-migration
          fi
