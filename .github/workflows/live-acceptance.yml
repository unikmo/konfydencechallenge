name: Live Acceptance Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write
  id-token: write

concurrency:
  group: live-acceptance-production
  cancel-in-progress: true

jobs:
  accept-live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://konfydence.com
      QA_OUT_DIR: qa-artifacts
      OIDC_AUDIENCE: konfydence-comasy-e2e
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish pending live acceptance status
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=pending -f context='Live Acceptance Gate' \
            -f description='Production infrastructure, integrations, analytics and journeys are being tested'

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install live browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact production SHA
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            code=$(curl -sS -o health.json -w '%{http_code}' "$BASE_URL/api/health/comasy" || true)
            release=$(jq -r '.releaseSha // empty' health.json 2>/dev/null || true)
            ready=$(jq -r '.ready // false' health.json 2>/dev/null || echo false)
            echo "Attempt $attempt/48 HTTP=$code ready=$ready release=${release:-unknown} expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$ready" = "true" ] && [ "$release" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Probe production integrations through signed OIDC
        id: integrations
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -r '.value')
          code=$(curl -sS -o qa-artifacts/integrations.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            "$BASE_URL/api/qa/integrations" || true)
          echo "Integration probe HTTP=$code"
          cat qa-artifacts/integrations.json || true
          [ "$code" = "200" ]

      - name: Run live acceptance journeys
        id: acceptance
        continue-on-error: true
        run: node scripts/live-acceptance.mjs

      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Publish reproduced live acceptance defects
        if: steps.integrations.outcome != 'success' || steps.acceptance.outcome != 'success'
        run: |
          set -euo pipefail
          gh label create 'qa:defect' --repo "${{ github.repository }}" --color B60205 --description 'Independent QA defect' --force >/dev/null
          gh label create 'qa:discovered' --repo "${{ github.repository }}" --color D93F0B --description 'Lifecycle: discovered' --force >/dev/null
          gh label create 'qa:reproduced' --repo "${{ github.repository }}" --color FBCA04 --description 'Lifecycle: reproduced' --force >/dev/null
          gh label create 'severity:critical' --repo "${{ github.repository }}" --color 8B0000 --description 'Critical severity' --force >/dev/null
          gh label create 'severity:high' --repo "${{ github.repository }}" --color D73A4A --description 'High severity' --force >/dev/null

          critical=0; high=0; medium=0
          if [ -f qa-artifacts/live-acceptance-report.json ]; then
            critical=$(jq '.counts.critical // 0' qa-artifacts/live-acceptance-report.json)
            high=$(jq '.counts.high // 0' qa-artifacts/live-acceptance-report.json)
            medium=$(jq '.counts.medium // 0' qa-artifacts/live-acceptance-report.json)
          fi
          [ '${{ steps.integrations.outcome }}' = 'success' ] || high=$((high + 1))
          severity='severity:high'
          [ "$critical" -gt 0 ] && severity='severity:critical'
          short=${GITHUB_SHA:0:7}
          title="[Live Acceptance][$short] Production acceptance defects"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            {
              echo '# Live Acceptance Agent'
              echo
              echo '**Lifecycle:** DISCOVERED → REPRODUCED'
              echo "**Commit:** \`$GITHUB_SHA\`"
              echo "**Critical:** $critical · **High:** $high · **Medium:** $medium"
              echo "**Integration probe:** ${{ steps.integrations.outcome }}"
              echo "**Journey test:** ${{ steps.acceptance.outcome }}"
              echo
              [ -f qa-artifacts/live-acceptance-report.md ] && cat qa-artifacts/live-acceptance-report.md
              echo
              if [ -f qa-artifacts/integrations.json ]; then
                echo '## Sanitized integration states'
                echo '```json'
                jq '{ok, integrations}' qa-artifacts/integrations.json
                echo '```'
              fi
              echo
              echo '### Required lifecycle'
              echo '`DISCOVERED → REPRODUCED → FIXED → RETESTED → CLOSED`'
            } > live-acceptance-issue.md
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file live-acceptance-issue.md \
              --label 'qa:defect' --label 'qa:discovered' --label 'qa:reproduced' --label "$severity"
          fi

      - name: Publish Live Acceptance Gate
        if: always()
        run: |
          if [ '${{ steps.integrations.outcome }}' = 'success' ] && [ '${{ steps.acceptance.outcome }}' = 'success' ]; then
            state=success
            description='Production live acceptance passed'
          else
            state=failure
            description='Production live acceptance found blocking defects'
            if [ -f qa-artifacts/live-acceptance-report.json ]; then
              finding=$(jq -r '[.findings[] | select(.severity=="critical" or .severity=="high")][0].message // empty' qa-artifacts/live-acceptance-report.json)
              [ -n "$finding" ] && description="$finding"
            fi
            if [ "$description" = 'Production live acceptance found blocking defects' ] && [ -f qa-artifacts/integrations.json ]; then
              integration=$(jq -r '.integrations | to_entries | map(select(.key != "commerceStripe" and .key != "cms" and .value.state != "ok")) | .[0] | if . then "\(.key) integration state is \(.value.state): \(.value.detail // \"no detail\")" else empty end' qa-artifacts/integrations.json)
              [ -n "$integration" ] && description="$integration"
            fi
          fi
          description=${description:0:140}
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$state" -f context='Live Acceptance Gate' -f description="$description"
          [ "$state" = success ]
