name: Konfydence editorial and challenge QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Protect canonical scenario and H.A.C.K. claims
        run: npm run audit:claims
      - name: Verify the new editorial journey and safety boundaries
        run: node scripts/verify-challenge-editorial.cjs
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Generate Prisma types
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
