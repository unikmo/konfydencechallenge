name: Merge Editorial Hero Into Validated Release

on:
  push:
    branches:
      - next15-lts-migration
    paths:
      - .github/workflows/merge-editorial-hero.yml

permissions:
  contents: write

jobs:
  merge-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      NEXT_PUBLIC_APP_URL: https://konfydence.com
      AUTH_SECRET: ci-only-not-a-production-secret
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-password-not-used-at-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          ref: next15-lts-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply editorial hero merge
        run: python scripts/merge-editorial-hero.py

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Scenario bank quality
        run: npm run audit:scenarios

      - name: Product claim consistency
        run: npm run audit:claims

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test -- --runInBand

      - name: ESLint zero warnings
        run: npm run lint -- --max-warnings=0

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated editorial hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Preserve clean editorial hero in 9.5 release"
          git push origin HEAD:next15-lts-migration
