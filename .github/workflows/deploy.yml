name: Konfydence Production Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/konfydence?schema=public
      NEXT_PUBLIC_APP_URL: https://konfydence.com
      AUTH_SECRET: ci-only-not-a-production-secret
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-password-not-used-at-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Scenario bank quality
        run: npm run audit:scenarios

      - name: Product claim consistency
        run: npm run audit:claims

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test -- --runInBand

      - name: ESLint — zero warnings
        run: npm run lint -- --max-warnings=0

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Quality summary
        run: |
          echo "Konfydence production quality gate passed"
          echo "Runtime dependency audit: no high-severity production findings"
          echo "Scenario banks: 5 x 40"
          echo "Free diagnostic: 8 cards / 2 per H.A.C.K. dimension"
          echo "Full run: 24 cards / 6 per H.A.C.K. dimension"
          echo "H.A.C.K.: Hurry / Authority / Comfort / Critical Action"
          echo "Unit tests: passed"
          echo "ESLint: zero warnings"
          echo "TypeScript: passed"
          echo "Next production build: passed"

# Production deployment remains the repository's native Vercel Git integration.
# A release is only considered production-ready when this gate and Vercel are green for the same main SHA.
