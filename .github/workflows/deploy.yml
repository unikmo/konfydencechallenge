name: Konfydence Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Scenario quality gate
        run: node scripts/audit-scenario-quality.cjs

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Quality summary
        run: |
          echo "Konfydence quality gate passed"
          echo "Scenario banks: 5 x 40"
          echo "H.A.C.K. balance: enforced"
          echo "TypeScript: passed"

# Production deployment is handled by the repository's native Vercel Git integration.
# Keeping deployment out of this workflow avoids duplicate deployments and secret drift.
