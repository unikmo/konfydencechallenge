name: CoMaSy HTTP E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

jobs:
  http-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://05akonfydencechallenge-git-comasy-platform-v1-unikmos-projects.vercel.app
      PRODUCTION_URL: https://konfydence.com
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      OIDC_AUDIENCE: konfydence-comasy-e2e

    steps:
      - name: Publish pending HTTP E2E status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then context='CoMaSy Production E2E'; else context='CoMaSy Preview E2E'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"$context\",\"description\":\"CoMaSy HTTP E2E running\"}"

      - name: Resolve reachable deployment
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_URL="$PRODUCTION_URL"
            MAX_TRIES=36
          else
            BASE_URL="$PREVIEW_URL"
            MAX_TRIES=6
          fi

          headers=()
          if [ -n "${VERCEL_BYPASS:-}" ]; then headers=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS"); fi

          for attempt in $(seq 1 "$MAX_TRIES"); do
            : > health-headers.txt
            : > health-body.txt
            curl -sS "${headers[@]}" -D health-headers.txt -o health-body.txt "$BASE_URL/api/health/comasy" || true
            code=$(awk 'toupper($1) ~ /^HTTP\// {status=$2} END {print status}' health-headers.txt)
            location=$(awk 'tolower($1) == "location:" {print $2}' health-headers.txt | tr -d '\r' | tail -1)

            if [ "$code" = "200" ] && grep -q '"ready":true' health-body.txt; then
              echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
              echo "runnable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "${{ github.event_name }}" = "pull_request" ] && [ "$code" = "302" ] && echo "$location" | grep -q 'vercel.com/sso-api'; then
              echo "::notice::Protected Vercel preview skipped for HTTP stateful checks; the same suite runs against production after merge."
              echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
              echo "runnable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/$MAX_TRIES: status=${code:-none}; waiting for deployment/backend readiness"
            sleep 10
          done

          echo "CoMaSy backend did not become ready at $BASE_URL" >&2
          cat health-headers.txt || true
          cat health-body.txt || true
          exit 1

      - name: Publish backend health stage
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Health E2E\",\"description\":\"Backend health stage: $OUTCOME\"}"

      - name: Public acquisition pages
        id: public
        if: steps.preflight.outputs.runnable == 'true'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          headers=(); [ -n "${VERCEL_BYPASS:-}" ] && headers=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS")
          curl "${headers[@]}" -LfsS "$BASE_URL/comasy" -o comasy.html
          grep -qi 'CoMaSy' comasy.html
          curl "${headers[@]}" -LfsS "$BASE_URL/comasy/pilot" -o pilot.html
          grep -qi 'pilot' pilot.html
          curl "${headers[@]}" -LfsS "$BASE_URL/comasy/dashboard/login" -o login.html
          grep -qi 'workspace' login.html

      - name: Publish public-page stage
        if: always() && steps.public.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.public.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Public Pages E2E\",\"description\":\"Public pages stage: $OUTCOME\"}"

      - name: Create ephemeral production fixture
        id: fixture
        if: github.event_name == 'push' && steps.preflight.outputs.runnable == 'true'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -r '.value')
          [ -n "$token" ] && [ "$token" != "null" ]
          curl -fsS -X POST -H "Authorization: Bearer $token" "$BASE_URL/api/comasy/e2e?action=setup" -o fixture.json
          grep -q '"ok":true' fixture.json

      - name: Publish fixture stage
        if: always() && github.event_name == 'push' && steps.fixture.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Fixture E2E\",\"description\":\"Ephemeral fixture stage: $OUTCOME\"}"

      - name: Customer tenant boundary and authenticated dashboard
        id: auth
        if: github.event_name == 'push' && steps.fixture.outcome == 'success'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          unauth=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/comasy/dashboard")
          case "$unauth" in 302|303|307|308) ;; *) echo "Expected unauthenticated dashboard redirect, got $unauth" >&2; exit 1;; esac

          login=$(curl -sS -c cookies.txt -o /dev/null -w '%{http_code}' \
            -X POST "$BASE_URL/api/comasy/auth/login" \
            --data-urlencode 'slug=e2e-alpha' \
            --data-urlencode 'accessCode=E2E-Access-2026' \
            --data-urlencode 'next=/comasy/dashboard/insights?period=90')
          [ "$login" = "303" ] || { echo "Expected login 303, got $login" >&2; exit 1; }

          curl -LfsS -b cookies.txt "$BASE_URL/comasy/dashboard" -o dashboard.html
          grep -qi 'Behaviour at a glance' dashboard.html
          curl -LfsS -b cookies.txt "$BASE_URL/comasy/dashboard/insights?period=90" -o insights.html
          grep -qi 'Behaviour over time' insights.html
          grep -qi '90 days' insights.html

      - name: Publish customer-auth stage
        if: always() && steps.auth.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Customer Auth E2E\",\"description\":\"Customer auth/dashboard stage: $OUTCOME\"}"

      - name: Evidence exports
        id: reports
        if: github.event_name == 'push' && steps.auth.outcome == 'success'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          curl -LfsS -b cookies.txt "$BASE_URL/api/comasy/reports/csv?type=executive&period=90" -o report.csv
          grep -qi 'Pause Adoption' report.csv
          curl -LfsS -b cookies.txt "$BASE_URL/api/comasy/reports/pdf?type=compliance&period=90" -o report.pdf
          head -c 4 report.pdf | grep -q '%PDF'

      - name: Publish reports stage
        if: always() && steps.reports.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.reports.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Reports E2E\",\"description\":\"Reports/export stage: $OUTCOME\"}"

      - name: Participant practice and persisted response
        id: practice
        if: github.event_name == 'push' && steps.reports.outcome == 'success'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          curl -LfsS "$BASE_URL/comasy/practice/e2e-token-a1?campaign=e2e-http-a" -o practice.html
          grep -qi 'HTTP Release Practice' practice.html
          grep -qi 'Choose the strongest next move' practice.html

          submitted=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/api/comasy/practice/respond" \
            --data-urlencode 'token=e2e-token-a1' \
            --data-urlencode 'campaignId=e2e-http-a' \
            --data-urlencode 'scenarioId=workplace-wrk-01' \
            --data-urlencode 'selectedAnswerKey=A')
          [ "$submitted" = "303" ] || { echo "Expected response redirect 303, got $submitted" >&2; exit 1; }

          curl -LfsS "$BASE_URL/comasy/practice/e2e-token-a1?campaign=e2e-http-a&feedback=1" -o feedback.html
          grep -qi 'YOUR LAST MOVE' feedback.html

      - name: Publish practice stage
        if: always() && steps.practice.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.practice.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Practice E2E\",\"description\":\"Practice/persistence stage: $OUTCOME\"}"

      - name: Remove ephemeral production fixture
        id: cleanup
        if: always() && github.event_name == 'push' && steps.preflight.outputs.runnable == 'true'
        shell: bash
        env:
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
        run: |
          set -euo pipefail
          token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -r '.value')
          [ -n "$token" ] && [ "$token" != "null" ]
          curl -fsS -X POST -H "Authorization: Bearer $token" "$BASE_URL/api/comasy/e2e?action=cleanup" -o cleanup.json
          grep -q '"cleaned":true' cleanup.json

      - name: Publish cleanup stage
        if: always() && github.event_name == 'push' && steps.cleanup.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "success" ] && state=success || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"CoMaSy Cleanup E2E\",\"description\":\"Fixture cleanup stage: $OUTCOME\"}"

      - name: Publish HTTP E2E commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then state=success; description='CoMaSy HTTP E2E passed'; else state=failure; description='CoMaSy HTTP E2E failed'; fi
          if [ "${{ github.event_name }}" = "push" ]; then context='CoMaSy Production E2E'; else context='CoMaSy Preview E2E'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
