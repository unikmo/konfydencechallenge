name: Konfydence production editorial E2E (read-only)
on:
  pull_request:
    branches: [main]
    paths: [scripts/qa-challenge-production.py, .github/workflows/editorial-live-e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Test public production without creating sessions or purchases
        run: python scripts/qa-challenge-production.py
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: konfydence-production-editorial-e2e
          path: artifacts/konfydence-live
          if-no-files-found: ignore
