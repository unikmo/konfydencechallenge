<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-labelledby="title desc">
  <title id="title">Konfydence phone lock screen — Pause. Assess. Talk.</title>
  <desc id="desc">A calm reminder for urgent, emotional or threatening messages: pause, assess what the request really wants, and talk to someone you trust.</desc>
  <rect width="1290" height="2796" fill="#f7f4ee"/>
  <text x="645" y="360" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="66" letter-spacing="2" fill="#111417">Konfydence</text>
  <text x="645" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="8" fill="#af8752">WHEN A MESSAGE RUSHES YOU</text>
  <text x="645" y="1010" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="180" fill="#111417">Pause.</text>
  <text x="645" y="1300" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="180" fill="#111417">Assess.</text>
  <text x="645" y="1590" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="180" fill="#af8752">Talk.</text>
  <rect x="345" y="1710" width="600" height="3" fill="#af8752"/>
  <text x="645" y="1900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#111417">Don't reply. Don't click. Don't send money.</text>
  <text x="645" y="1984" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#5e5b56">What does it really want — money, a code, access?</text>
  <text x="645" y="2054" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#5e5b56">Say it out loud to someone you trust first.</text>
  <rect x="115" y="2380" width="1060" height="230" rx="60" fill="#12191f"/>
  <text x="645" y="2472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="3" fill="#fff">HURRY · AUTHORITY · COMFORT · KILL-SWITCH</text>
  <text x="645" y="2536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#cdbfa8">If a message uses these to rush you, it is pressure — not proof.</text>
  <text x="645" y="2726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111417">konfydence.com</text>
</svg>
